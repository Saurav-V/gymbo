<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a0f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<title>Gymbo – Gym Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#070a0f;--panel:#0b1119;--line:rgba(143,211,230,.22);--line2:rgba(143,211,230,.07);--tx:#e6eef2;--dim:#6b7f8b;--ac:#8fd3e6;--red:#f0583a;--cr:#f3e9a8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-weight:400;font-variant-numeric:tabular-nums}
body{min-height:100vh;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
button,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);padding:11px 14px;cursor:pointer;letter-spacing:.06em}
button:active{background:rgba(142,230,255,.14)}
.pri{border-color:var(--ac);color:var(--ac);font-weight:700}
.dng{border-color:var(--red);color:var(--red)}
.ghost{border:0;padding:6px 8px;color:var(--ac)}
#app{padding:18px 16px 110px;max-width:560px;margin:0 auto}
h1{font-weight:300;font-size:26px;letter-spacing:.14em;margin:6px 0 18px}
h2{font-weight:500;font-size:13px;letter-spacing:.18em;color:var(--dim);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{border:1px solid var(--line);background:rgba(8,12,18,.82);padding:14px;margin-bottom:12px;position:relative}
.card::before,.card::after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--ac);opacity:.8}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.dim{color:var(--dim);font-size:13px}.big{font-size:30px;font-weight:300}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(4,6,10,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;padding:14px 0 12px;color:var(--dim);font-size:13px;letter-spacing:.14em}
nav button.on{color:var(--cr);box-shadow:inset 0 3px 0 var(--red)}
input{background:transparent;border:1px solid var(--line);padding:10px;width:100%;outline:none;border-radius:0}
input:focus{border-color:var(--ac)}
.set{display:grid;grid-template-columns:30px 1fr 80px 70px 44px;gap:8px;align-items:center;margin:6px 0}
.set input{text-align:center;padding:9px 4px}
.set.done input{border-color:var(--cr);color:var(--cr)}
.chk{padding:9px 0;text-align:center}.set.done .chk{background:var(--cr);color:#070a0f;border-color:var(--cr)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;color:var(--dim);flex:1;padding:10px 0}.tabs .on{color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.chips button{white-space:nowrap;border-radius:99px;padding:7px 14px;font-size:13px}.chips .on{border-color:var(--ac);color:var(--ac)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 120px}
.ov>div{max-width:560px;margin:0 auto}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.item.sel{background:rgba(240,88,58,.1);box-shadow:inset 3px 0 0 var(--red)}
.item .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ac);font-size:12px}
.foot{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:528px;margin:0 auto;z-index:10;background:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;z-index:4}
.rest{position:sticky;top:0;background:var(--bg);border:1px solid var(--ac);padding:8px 12px;margin-bottom:12px;z-index:3}
svg text{font-family:"IBM Plex Mono",monospace;fill:var(--dim);font-size:10px}
.big,.set input,#clk,b{font-family:"IBM Plex Mono",ui-monospace,monospace}
b{font-weight:500}
.hot{background:var(--red);border-color:var(--red);color:#070a0f;font-weight:600}
.tag{background:var(--red);color:#070a0f;padding:3px 9px;font-size:12px;font-weight:600;letter-spacing:.1em}
h2::before{content:"";width:8px;height:8px;background:var(--red)}
.rest{border-color:var(--ac)}
.rest::before{content:"";display:block;height:6px;margin:-8px -12px 8px;background:repeating-linear-gradient(135deg,rgba(143,211,230,.45) 0 2px,transparent 2px 7px)}
.ic.c1{color:var(--red);border-color:var(--red)}.ic.c2{color:var(--cr);border-color:var(--cr)}.ic.c3{color:var(--ac);border-color:var(--ac)}.ic.c4{color:#5b9fbd;border-color:#5b9fbd}.ic.c5{color:var(--tx)}
.set .num{width:100%;padding:9px 0;font-family:"IBM Plex Mono",monospace;color:var(--dim)}
.set .num.wu{color:var(--cr);border-color:var(--cr)}
</style></head><body>
<div id="app"></div><div id="layer"></div>
<script>
const EX=[["Bench Press","Barbell","Chest"],["Incline Bench Press","Dumbbell","Chest"],["Incline Bench Press","Barbell","Chest"],["Chest Fly","Cable","Chest"],["Push Up","Bodyweight","Chest"],["Shoulder Press","Dumbbell","Shoulders"],["Overhead Press","Barbell","Shoulders"],["Lateral Raise","Dumbbell","Shoulders"],["Face Pull","Cable","Shoulders"],["Triceps Rope Pushdown","Cable","Triceps"],["Skull Crusher","Barbell","Triceps"],["Dip","Bodyweight","Triceps"],["Deadlift","Barbell","Glutes"],["Romanian Deadlift","Barbell","Hamstrings"],["Lying Leg Curl","Machine","Hamstrings"],["Squat","Barbell","Quadriceps"],["Leg Press","Machine","Quadriceps"],["Leg Extension","Machine","Quadriceps"],["Calf Raise","Machine","Calves"],["Hip Thrust","Barbell","Glutes"],["Pull Up","Bodyweight","Lats"],["Lat Pulldown","Cable","Lats"],["Bent Over Row","Barbell","Back"],["Seated Row","Cable","Back"],["One Arm Row","Dumbbell","Back"],["Bicep Curl","Dumbbell","Biceps"],["Hammer Curl","Dumbbell","Biceps"],["Preacher Curl","Barbell","Biceps"],["Plank","Bodyweight","Core"],["Cable Crunch","Cable","Core"]];
const nm=e=>`${e[0]} (${e[1]})`,META={};EX.forEach(e=>META[nm(e)]=e);
const DEF={routines:[{id:1,folder:"PPL (Push/Pull/Legs)",name:"Push Day",exs:["Bench Press (Barbell)","Incline Bench Press (Dumbbell)","Shoulder Press (Dumbbell)","Lateral Raise (Dumbbell)","Triceps Rope Pushdown (Cable)"]}],workouts:[],active:null,custom:[]};
let S;try{S=JSON.parse(localStorage.getItem("gymbo_v1")||localStorage.getItem("tether_v1"))||DEF}catch(e){S=DEF}
const ui={tab:"home",view:null,detail:null,dtab:"sum",metric:"w",pick:null,del:null,rest:0};
let asked=0;
const askP=()=>{if(asked)return;asked=1;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().then(pstat)}catch(e){}};
const save=()=>{try{localStorage.setItem("gymbo_v1",JSON.stringify(S))}catch(e){}askP()};
function pstat(){try{navigator.storage&&navigator.storage.persisted&&navigator.storage.persisted().then(p=>{const e=$("#pst");if(e)e.textContent="Storage protection: "+(p?"on":"off. Install to the home screen, then reopen.")})}catch(e){}}
const stale=()=>S.workouts.length&&Date.now()-(S.lastBackup||0)>14*864e5;
const EC={Barbell:"c1",Dumbbell:"c2",Cable:"c3",Machine:"c4",Bodyweight:"c5"};
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:99;background:#f3e9a8;color:#070a0f;padding:12px;text-align:center;font-weight:500";document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function dl(f){const u=URL.createObjectURL(f),l=document.createElement("a");l.href=u;l.download=f.name;document.body.appendChild(l);l.click();setTimeout(()=>{l.remove();URL.revokeObjectURL(u)},1500)}
async function backup(sh){const f=new File([JSON.stringify(S)],"gymbo-backup-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json",{type:"application/json"});let ok=0;
try{if(sh&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Gymbo backup"});ok=1;toast("Backup shared")}else throw 0}
catch(e){if(e&&e.name==="AbortError")return;try{dl(f);ok=1;toast("Download started: "+f.name+". Check your Downloads folder.")}catch(_){toast("Backup failed. Try Save file on the Profile tab.")}}
if(ok){S.lastBackup=Date.now();save();render()}}
const $=s=>document.querySelector(s),app=$("#app"),layer=$("#layer");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
const fd=t=>new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const lib=()=>EX.concat(S.custom).map(e=>[...e]);
const vol=w=>w.exs.reduce((a,x)=>a+x.sets.reduce((b,s)=>b+(s.w?0:s.kg*s.reps),0),0);
const e1=s=>s.kg*(1+s.reps/30);
function hist(name){const o=[];S.workouts.forEach(w=>w.exs.forEach(x=>{if(x.n===name&&x.sets.length)o.push({t:w.date,sets:x.sets,work:x.sets.filter(s=>!s.w),note:x.note||""})}));return o.sort((a,b)=>a.t-b.t)}
const setRows=ss=>ss.map((s,i)=>`<div class="row sp dim" style="padding:3px 0"><span>${s.w?"Warm-up":"Set "+ss.slice(0,i+1).filter(t=>!t.w).length}</span><span style="color:var(--tx)">${s.kg} kg × ${s.reps}</span></div>`).join("");
const noteH=n=>n?`<div class="dim" style="margin-top:6px">Note: ${esc(n)}</div>`:"";
function routineView(){const r=S.routines.find(r=>r.id===ui.rd);if(!r){ui.rd=null;return home()}
return `<div class="row sp"><button class="ghost" data-a="rback">← Back</button><button class="ghost" data-a="editR" data-v="${r.id}">Edit</button></div><h1 style="margin-top:14px">${esc(r.name)}</h1>${r.exs.map(n=>{const h=hist(n),l=h[h.length-1];return `<div class="card"><b style="color:var(--ac)" data-a="detail" data-v="${esc(n)}">${esc(n)}</b>${l?`<div class="dim" style="margin:6px 0">Last session ${fd(l.t)}</div>${setRows(l.sets)}${noteH(l.note)}`:`<div class="dim" style="margin-top:6px">No history yet</div>`}</div>`}).join("")}<div class="foot"><button class="hot" style="width:100%;padding:15px" data-a="startR" data-v="${r.id}">Start routine</button></div>`}
function sessionView(){const w=S.workouts.find(w=>w.id===ui.sd);if(!w){ui.sd=null;return home()}
const n=w.exs.reduce((a,x)=>a+x.sets.filter(s=>!s.w).length,0);
return `<div class="row sp"><button class="ghost" data-a="sback">← Back</button><button class="ghost" style="color:var(--dim)" data-a="delw" data-v="${w.id}">${ui.del==="w"+w.id?"Tap again to delete":"Delete"}</button></div><h1 style="margin-top:14px">${esc(w.name)}</h1><div class="card grid2"><div><div class="dim">Date</div><b>${new Date(w.date).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</b></div><div><div class="dim">Time</div><b>${fmt(w.dur)}</b></div><div><div class="dim">Volume</div><b style="color:var(--cr)">${Math.round(vol(w)).toLocaleString()} kg</b></div><div><div class="dim">Working sets</div><b>${n}</b></div></div>${w.exs.map(x=>`<div class="card"><b style="color:var(--ac)" data-a="detail" data-v="${esc(x.n)}">${esc(x.n)}</b><div style="margin-top:6px">${setRows(x.sets)}</div>${noteH(x.note)}</div>`).join("")}`}
function pbl(){const p=ui.pick;return p.sel.length?(p.mode==="routine"?`Save routine (${p.sel.length})`:`Add ${p.sel.length} exercise${p.sel.length>1?"s":""}`):"Select exercises"}
function pbtn(){const b=$("#pdn");if(b)b.textContent=pbl()}
const nav=()=>`<nav>${[["home","Home"],["workout","Workout"],["profile","Profile"]].map(t=>`<button data-a="tab" data-v="${t[0]}" class="${ui.tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</nav>`;

function ring(){ // weekly dial
  const now=Date.now(),wk=S.workouts.filter(w=>now-w.date<7*864e5).length,goal=4,R=70,C=2*Math.PI*R;
  let ticks="";for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?88:84,r2=92;ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="${i%5?"rgba(143,211,230,.28)":"#f3e9a8"}"/>`}
  return `<svg viewBox="0 0 200 200" width="170" height="170">${ticks}<circle cx="100" cy="100" r="${R}" fill="none" stroke="rgba(190,225,240,.15)" stroke-width="3"/><circle cx="100" cy="100" r="${R}" fill="none" stroke="#8ee6ff" stroke-width="3" stroke-dasharray="${Math.min(1,wk/goal)*C} ${C}" transform="rotate(-90 100 100)"/><circle cx="100" cy="100" r="54" fill="none" stroke="#f0583a" stroke-opacity=".7" stroke-dasharray="2 5"/><text x="100" y="108" text-anchor="middle" style="font-size:34px;font-weight:300;fill:#e2f1f7">${wk}</text><text x="100" y="128" text-anchor="middle">of ${goal} this week</text></svg>`}

function home(){
  const ws=[...S.workouts].reverse(),tot=S.workouts.reduce((a,w)=>a+vol(w),0);
  return `<div class="row sp"><h1>GYMBO</h1><span class="tag">${S.active?"IN PROGRESS":"READY"}</span></div>${S.active?`<div class="card row sp" style="border-color:var(--red)"><span>Workout in progress</span><button class="hot" data-a="resume">Resume</button></div>`:""}${stale()?`<div class="card row sp" style="border-color:var(--red)"><span>Back up your log</span><button class="hot" data-a="share">Save backup</button></div>`:""}<div class="card row sp"><div>${ring()}</div><div style="text-align:right"><div class="dim">Total lifted</div><div class="big" style="color:var(--cr)">${Math.round(tot).toLocaleString()}</div><div class="dim">kg</div><div class="dim" style="margin-top:12px">Sessions logged</div><div class="big" style="color:var(--red)">${S.workouts.length}</div></div></div>
  <h2>Recent sessions</h2>${ws.length?ws.slice(0,20).map(w=>`<div class="card" data-a="openS" data-v="${w.id}"><div class="row sp"><b>${esc(w.name)}</b><span class="dim">${fd(w.date)} · ${fmt(w.dur)}</span></div><div class="dim" style="margin:6px 0 8px">${Math.round(vol(w)).toLocaleString()} kg volume</div>${w.exs.map(x=>{const w2=x.sets.filter(s=>!s.w),w3=w2.length?w2:x.sets,b=w3.reduce((m,s)=>s.kg>=m.kg?s:m,w3[0]);return `<div class="row sp" style="font-size:14px;padding:2px 0"><span>${x.sets.length} × ${esc(x.n)}</span><span class="dim">${b.kg} kg × ${b.reps}</span></div>`}).join("")}<div style="text-align:right"><button class="ghost dng" style="border:0;color:var(--dim);font-size:12px" data-a="delw" data-v="${w.id}">${ui.del==="w"+w.id?"Tap again to delete":"Delete"}</button></div></div>`).join(""):`<div class="card dim">No sessions yet. Open the Workout tab and start your first one.</div>`}`}

function workout(){
  const a=S.active,folders=[...new Set(S.routines.map(r=>r.folder))];
  return `<h1>WORKOUT</h1><h2>Quick start</h2><button class="hot" style="width:100%;padding:16px" data-a="startEmpty">+ Start empty workout</button>
  <h2>Routines</h2><button style="width:100%" data-a="newR">New routine</button>
  ${folders.map(f=>`<div class="dim" style="margin:18px 0 8px">${esc(f)}</div>${S.routines.filter(r=>r.folder===f).map(r=>`<div class="card"><div class="row sp"><b data-a="openR" data-v="${r.id}" style="flex:1">${esc(r.name)}</b><span><button class="ghost" data-a="editR" data-v="${r.id}">Edit</button><button class="ghost" style="color:var(--dim)" data-a="delr" data-v="${r.id}">${ui.del==="r"+r.id?"Confirm delete":"×"}</button></span></div><div class="dim" data-a="openR" data-v="${r.id}" style="margin:6px 0 12px">${r.exs.map(esc).join(", ")}</div><button class="pri" style="width:100%" data-a="startR" data-v="${r.id}">Start routine</button></div>`).join("")}`).join("")}
  ${a?`<div class="bar"><div class="dim" style="text-align:center;margin-bottom:6px">Workout in progress</div><div class="grid2"><button class="ghost" data-a="resume">▶ Resume</button><button class="ghost dng" style="color:var(--red)" data-a="discard">✕ Discard</button></div></div>`:""}`}

function profile(){
  const done=[...new Set(S.workouts.flatMap(w=>w.exs.map(x=>x.n)))];
  return `<h1>PROFILE</h1><h2>Exercise progress</h2>${done.length?done.map(n=>{const h=hist(n),m=Math.max(0,...h.flatMap(x=>x.work.map(s=>s.kg)));return `<div class="item" data-a="detail" data-v="${esc(n)}"><div class="ic ${EC[(META[n]||[])[1]]||""}">${esc(n[0])}</div><div style="flex:1">${esc(n)}<div class="dim">${h.length} sessions</div></div><b>${m} kg</b></div>`}).join(""):`<div class="card dim">Finish a workout to see per-exercise progress here.</div>`}
  <h2>Data</h2><div class="card"><div class="dim" style="margin-bottom:10px">Your log is stored on this device. Protected storage stops Chrome clearing it when space runs low, but a backup is the only full safety net.</div><button class="hot" style="width:100%;margin-bottom:10px" data-a="share">Save backup</button><div class="grid2"><button data-a="export">Download file</button><button data-a="import">Import backup</button></div><div class="dim" style="margin-top:12px" id="pst">Storage protection: checking</div><div class="dim">Last backup: ${S.lastBackup?fd(S.lastBackup):"never"}</div><input id="imp" type="file" accept=".json" hidden></div>`}

function detail(){
  const n=ui.detail,h=hist(n),m=META[n]||[n,"","Custom"],f={w:s=>s.kg,o:e1,v:s=>s.kg*s.reps}[ui.metric];
  const pts=h.filter(x=>x.work.length).map(x=>({t:x.t,v:Math.max(...x.work.map(f))}));
  const best=pts.length?Math.max(...pts.map(p=>p.v)):0;
  return `<div class="row sp"><button class="ghost" data-a="back">← Back</button><b>${esc(n)}</b><span style="width:60px"></span></div>
  <div class="tabs" style="margin-top:12px"><button data-a="dtab" data-v="sum" class="${ui.dtab==="sum"?"on":""}">Summary</button><button data-a="dtab" data-v="his" class="${ui.dtab==="his"?"on":""}">History</button></div>
  ${ui.dtab==="sum"?`<div class="card"><div class="dim">Primary: ${esc(m[2])} · ${esc(m[1])}</div><div class="big" style="margin-top:8px">${Math.round(best*10)/10} <span class="dim">${ui.metric==="v"?"kg × reps":"kg"}</span></div>${chart(pts)}</div><div class="chips">${[["w","Heaviest weight"],["o","One rep max"],["v","Best set volume"]].map(c=>`<button data-a="metric" data-v="${c[0]}" class="${ui.metric===c[0]?"on":""}">${c[1]}</button>`).join("")}</div>`
  :[...h].reverse().map(x=>`<div class="card"><b>${fd(x.t)}</b>${setRows(x.sets)}${noteH(x.note)}</div>`).join("")||`<div class="dim">No history yet.</div>`}`}

function chart(p){
  if(!p.length)return `<div class="dim" style="padding:30px 0;text-align:center">No data yet</div>`;
  const W=330,H=170,L=34,B=22,mx=Math.max(...p.map(x=>x.v))*1.1||1,mn=Math.min(0,Math.min(...p.map(x=>x.v))*.9);
  const X=i=>p.length>1?L+i*(W-L-10)/(p.length-1):(W+L)/2,Y=v=>H-B-(v-mn)/(mx-mn)*(H-B-10);
  let g="";for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(190,225,240,.12)"/><text x="${L-5}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`}
  const lab=p.map((x,i)=>p.length<8||i%Math.ceil(p.length/6)===0?`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fd(x.t)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px">${g}<polygon fill="rgba(143,211,230,.12)" points="${X(0)},${H-B} ${p.map((x,i)=>X(i)+","+Y(x.v)).join(" ")} ${X(p.length-1)},${H-B}"/><polyline fill="none" stroke="#f3e9a8" stroke-width="1.5" points="${p.map((x,i)=>X(i)+","+Y(x.v)).join(" ")}"/>${p.map((x,i)=>{const z=i==p.length-1;return `<circle cx="${X(i)}" cy="${Y(x.v)}" r="${z?4:3}" fill="${z?"#f0583a":"#070a0f"}" stroke="${z?"#f0583a":"#f3e9a8"}"/>`}).join("")}${lab}</svg>`}

function render(){
  layer.innerHTML="";
  if(ui.view==="active"&&S.active){app.innerHTML=active();if(ui.pick)picker();else if(ui.fin)finDlg();return}
  ui.view=null;
  const sub=ui.detail?detail():ui.rd?routineView():ui.sd?sessionView():null;
  app.innerHTML=(sub||(ui.tab==="home"?home():ui.tab==="workout"?workout():profile()))+((ui.detail||ui.rd||ui.sd)?"":nav());
  if(ui.pick)picker();
  pstat();
}
function active(){
  const a=S.active;
  return `<div class="row sp"><button class="ghost" data-a="min">⌄ Minimize</button><span id="clk" class="big" style="font-size:20px">${fmt((Date.now()-a.start)/1000)}</span><button class="hot" data-a="finish">Finish</button></div>
  <div class="rest" id="rest" ${ui.rest?"":"hidden"}><div class="row sp"><span>Rest <b id="rt">${ui.rest?fmt((Date.now()-ui.rest)/1000):"0:00"}</b></span><span><button class="ghost" data-a="rest" data-v="reset">Restart</button><button class="ghost" data-a="rest" data-v="0">Hide</button></span></div></div>
  <input id="wn" value="${esc(a.name)}" style="margin:14px 0;font-size:18px;font-weight:500">
  ${a.exs.map((x,i)=>{const h=hist(x.n),last=h.length?h[h.length-1].sets:[];return `<div class="card"><div class="row sp"><b style="color:var(--ac)" data-a="detail" data-v="${esc(x.n)}">${esc(x.n)}</b><button class="ghost dng" style="color:var(--dim)" data-a="rmex" data-v="${i}">Remove</button></div>
  <input data-nt="" data-i="${i}" placeholder="Add a note" value="${esc(x.note||"")}" style="margin:8px 0 4px;font-size:14px">${h.length&&h[h.length-1].note?`<div class="dim" style="font-size:12px;margin-bottom:4px">Last time: ${esc(h[h.length-1].note)}</div>`:""}<div class="set dim" style="font-size:11px"><span>Set</span><span>Previous</span><span>kg</span><span>Reps</span><span></span></div>
  ${x.sets.map((s,j)=>{const n=x.sets.slice(0,j+1).filter(t=>!t.w).length,m=ui.sm===i+"-"+j;return `<div class="set ${s.done?"done":""}"><button class="num ${s.w?"wu":""}" data-a="sm" data-i="${i}" data-j="${j}">${s.w?"W":n}</button><span class="dim">${last[j]?last[j].kg+" × "+last[j].reps:"–"}</span><input inputmode="decimal" data-i="${i}" data-j="${j}" data-f="kg" value="${s.kg||""}" placeholder="0"><input inputmode="numeric" data-i="${i}" data-j="${j}" data-f="reps" value="${s.reps||""}" placeholder="0"><button class="chk" data-a="chk" data-i="${i}" data-j="${j}">✓</button></div>${m?`<div class="grid2" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:6px"><button data-a="swt" data-i="${i}" data-j="${j}" data-v="0">Normal</button><button data-a="swt" data-i="${i}" data-j="${j}" data-v="1">Warm-up</button><button class="dng" data-a="dels" data-i="${i}" data-j="${j}">Delete</button></div>`:""}`}).join("")}
  <button style="width:100%;margin-top:8px" data-a="addset" data-v="${i}">+ Add set</button></div>`}).join("")}
  <button class="pri" style="width:100%;margin-bottom:12px" data-a="openPick">+ Add exercise</button><button class="dng" style="width:100%" data-a="discard">Discard workout</button>`}

function picker(){
  const p=ui.pick;
  layer.innerHTML=`<div class="ov"><div><div class="row sp"><button class="ghost" data-a="pcancel">Cancel</button><b>${p.mode==="routine"?(p.editId?"Edit routine":"New routine"):"Add exercise"}</b><button class="ghost" data-a="pcreate">Create</button></div>
  ${p.mode==="routine"?`<input id="rn" placeholder="Routine name" value="${esc(p.name||"")}" style="margin-top:12px">`:""}
  <input id="q" placeholder="Search exercise" value="${esc(p.q)}" style="margin:12px 0"><div class="grid2"><button id="beq" data-a="peq">${p.eq||"All equipment"}</button><button id="bmu" data-a="pmu">${p.mu||"All muscles"}</button></div>
  <div id="plist"></div></div></div><div class="foot"><button class="pri" style="width:100%;padding:15px" id="pdn" data-a="pdone">${pbl()}</button></div>`;
  plist();
}
function plist(){
  const p=ui.pick,q=p.q.toLowerCase(),rec=[...new Set(S.workouts.slice(-5).flatMap(w=>w.exs.map(x=>x.n)))];
  const L=lib().filter(e=>(!q||nm(e).toLowerCase().includes(q)||e[2].toLowerCase().includes(q))&&(!p.eq||e[1]===p.eq)&&(!p.mu||e[2]===p.mu));
  const it=e=>`<div class="item ${p.sel.includes(nm(e))?"sel":""}" data-a="psel" data-v="${esc(nm(e))}"><div class="ic ${EC[e[1]]||""}">${esc(e[1][0])}</div><div style="flex:1">${esc(nm(e))}<div class="dim">${esc(e[2])}</div></div></div>`;
  const r=L.filter(e=>rec.includes(nm(e)));
  $("#plist").innerHTML=(r.length&&!q?`<h2>Recent</h2>${r.map(it).join("")}`:"")+`<h2>All exercises</h2>${L.map(it).join("")||'<div class="dim">No match. Use Create to add it.</div>'}`;
}
function cyc(list,cur){const i=list.indexOf(cur);return list[(i+1)%list.length]}
const EQS=["","Barbell","Dumbbell","Cable","Machine","Bodyweight"],MUS=["","Chest","Shoulders","Triceps","Biceps","Back","Lats","Quadriceps","Hamstrings","Glutes","Calves","Core"];

function startW(name,exs){ui.rd=null;ui.sd=null;ui.detail=null;S.active={start:Date.now(),name,exs:exs.map(n=>{const h=hist(n),l=h.length?h[h.length-1].sets:[];return{n,sets:l.length?l.map(s=>({kg:s.kg,reps:s.reps,w:s.w,done:false})):[{kg:0,reps:0,done:false}]}})};save();ui.view="active";render()}
function tryFinish(){const a=S.active,inc=a.exs.reduce((n,x)=>n+x.sets.filter(t=>!(t.done&&t.reps>0)).length,0),dur=(Date.now()-a.start)/1000;
if(inc||dur>=7200){ui.fin={inc,dur};render()}else finish()}
function finDlg(){const f=ui.fin,lg=f.dur>=7200;
layer.innerHTML=`<div class="ov"><div style="padding-top:8vh"><div class="card"><b style="font-size:18px">Finish workout?</b>${f.inc?`<p>${f.inc} set${f.inc>1?"s aren't":" isn't"} marked done and won't be saved.</p>`:""}${lg?`<p>Your timer reads <b style="color:var(--cr)">${fmt(f.dur)}</b>. Did you forget to finish? Choose how long you trained.</p><div class="chips" style="flex-wrap:wrap">${[[1800,"30 min"],[3600,"1 hour"],[7200,"2 hours"]].map(o=>`<button class="hot" data-a="fdur" data-v="${o[0]}">${o[1]}</button>`).join("")}<button data-a="fdur" data-v="${Math.round(f.dur)}">Keep ${fmt(f.dur)}</button></div><div class="row" style="margin-top:10px"><input id="fmin" inputmode="numeric" placeholder="Other length in minutes"><button class="pri" data-a="fcustom">Set</button></div>`:""}<div class="row" style="margin-top:14px"><button style="flex:1" data-a="fback">Keep editing</button>${lg?"":`<button class="hot" style="flex:1" data-a="fgo">Finish anyway</button>`}</div></div></div></div>`}
function finish(d){
  const a=S.active;a.exs.forEach(x=>x.sets=x.sets.filter(s=>s.done&&s.reps>0));a.exs=a.exs.filter(x=>x.sets.length);
  if(a.exs.length){S.workouts.push({id:Date.now(),date:Date.now(),dur:d==null?(Date.now()-a.start)/1000:d,name:a.name||"Workout",exs:a.exs})}
  if(!a.exs.length)toast("No completed sets, so nothing was saved");S.active=null;ui.fin=null;ui.view=null;ui.tab="home";ui.rest=0;save();render()}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.pick.q=t.value;plist()}
  else if(t.id==="rn")ui.pick.name=t.value;
  else if(t.id==="wn"){S.active.name=t.value;save()}
  else if(t.dataset.nt!==undefined){S.active.exs[t.dataset.i].note=t.value;save()}
  else if(t.dataset.f){S.active.exs[t.dataset.i].sets[t.dataset.j][t.dataset.f]=parseFloat(t.value)||0;save()}
});
document.addEventListener("change",e=>{if(e.target.id==="imp"){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(d.workouts&&d.routines){S=d;save();render()}}catch(_){}})}});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==="tab"){ui.tab=v;ui.detail=null;ui.rd=null;ui.sd=null}
  else if(a==="startEmpty")return startW("Workout",[]);
  else if(a==="startR"){const r=S.routines.find(r=>r.id==v);return startW(r.name,r.exs)}
  else if(a==="resume"){ui.view="active"}
  else if(a==="min"){ui.view=null;ui.pick=null;ui.tab="home"}
  else if(a==="discard"){if(ui.del!=="disc"){ui.del="disc";el.textContent="Tap again to discard";return}S.active=null;ui.view=null;ui.del=null;save()}
  else if(a==="finish")return tryFinish();
  else if(a==="fgo")return finish();
  else if(a==="fdur")return finish(+v);
  else if(a==="fcustom"){const m=parseFloat($("#fmin").value);if(!(m>0)){$("#fmin").focus();return}return finish(m*60)}
  else if(a==="fback")ui.fin=null;
  else if(a==="chk"){const s=S.active.exs[el.dataset.i].sets[el.dataset.j];s.done=!s.done;if(s.done){ui.rest=Date.now()}save()}
  else if(a==="openR"){scrollTo(0,0);ui.rd=S.routines.find(r=>r.id==v).id}
  else if(a==="rback")ui.rd=null;
  else if(a==="openS"){scrollTo(0,0);ui.sd=S.workouts.find(w=>w.id==v).id}
  else if(a==="sback")ui.sd=null;
  else if(a==="sm"){const k=el.dataset.i+"-"+el.dataset.j;ui.sm=ui.sm===k?null:k}
  else if(a==="swt"){S.active.exs[el.dataset.i].sets[el.dataset.j].w=v==="1";ui.sm=null;save()}
  else if(a==="dels"){S.active.exs[el.dataset.i].sets.splice(el.dataset.j,1);ui.sm=null;save()}
  else if(a==="addset"){const x=S.active.exs[v],l=x.sets[x.sets.length-1];x.sets.push({kg:l?l.kg:0,reps:l?l.reps:0,done:false});save()}
  else if(a==="rmex"){S.active.exs.splice(v,1);save()}
  else if(a==="rest"){ui.rest=v==="0"?0:Date.now()}
  else if(a==="delw"){if(ui.del!=="w"+v){ui.del="w"+v}else{S.workouts=S.workouts.filter(w=>w.id!=v);ui.del=null;save()}}
  else if(a==="delr"){if(ui.del!=="r"+v){ui.del="r"+v}else{S.routines=S.routines.filter(r=>r.id!=v);ui.del=null;save()}}
  else if(a==="editR"){const r=S.routines.find(r=>r.id==v);ui.pick={mode:"routine",editId:r.id,sel:[...r.exs],q:"",eq:"",mu:"",name:r.name}}
  else if(a==="newR")ui.pick={mode:"routine",sel:[],q:"",eq:"",mu:"",name:""};
  else if(a==="openPick")ui.pick={mode:"active",sel:[],q:"",eq:"",mu:""};
  else if(a==="pcancel")ui.pick=null;
  else if(a==="psel"){const s=ui.pick.sel,i=s.indexOf(v);i<0?s.push(v):s.splice(i,1);plist();pbtn();return}
  else if(a==="peq"){ui.pick.eq=cyc(EQS,ui.pick.eq);$("#beq").textContent=ui.pick.eq||"All equipment";plist();return}
  else if(a==="pmu"){ui.pick.mu=cyc(MUS,ui.pick.mu);$("#bmu").textContent=ui.pick.mu||"All muscles";plist();return}
  else if(a==="pcreate"){const n=ui.pick.q.trim();if(!n){$("#q").focus();return}const eq=ui.pick.eq||"Other",e=[n,eq,ui.pick.mu||"Custom"];S.custom.push(e);ui.pick.sel.push(nm(e));ui.pick.q="";save();picker();return}
  else if(a==="pdone"){const p=ui.pick;if(!p.sel.length)return;if(p.mode==="routine"){const nme=(p.name||"").trim()||"New routine",er=p.editId&&S.routines.find(r=>r.id===p.editId);if(er){er.name=nme;er.exs=p.sel}else S.routines.push({id:Date.now(),folder:"My routines",name:nme,exs:p.sel})}else{p.sel.forEach(n=>S.active.exs.push({n,sets:[{kg:0,reps:0,done:false}]}))}ui.pick=null;save()}
  else if(a==="detail"){scrollTo(0,0);ui.detail=v;ui.dtab="sum";ui.metric="w"}
  else if(a==="back")ui.detail=null;
  else if(a==="dtab")ui.dtab=v;
  else if(a==="metric")ui.metric=v;
  else if(a==="export"){backup(false);return}
  else if(a==="share"){backup(true);return}
  else if(a==="import"){$("#imp").click();return}
  render();
});
setInterval(()=>{
  if(ui.view==="active"&&S.active){const c=$("#clk");if(c)c.textContent=fmt((Date.now()-S.active.start)/1000);
    const r=$("#rest");if(r&&ui.rest){r.hidden=false;$("#rt").textContent=fmt((Date.now()-ui.rest)/1000)}}
},500);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
askP();render();
</script></body></html>
