<style>

.set>span{text-align:center}
.top{z-index:40}
.sw{width:48px;height:26px;padding:0;border-radius:13px;position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:left .15s}

.cel{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--cr);padding:18px 28px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.cel .medal{animation:spin .8s ease-out}.cf{position:absolute;top:30%;width:6px;height:10px;animation:fall 1.4s ease-out forwards}

@keyframes spin{from{transform:rotate(-25deg) scale(.5)}to{transform:none}}
@keyframes fall{to{transform:translate(var(--dx),170px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.cel,.cel *{animation:none!important}}
.added{border-color:var(--cr);color:var(--cr)}
.sw2{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}.sw2.on{outline:2px solid var(--tx);outline-offset:2px}
button:disabled{opacity:.3}
.rchip{display:inline-block;padding:3px 12px;border-radius:99px;color:#070a0f;font-weight:600}
.grip{touch-action:none;user-select:none;cursor:grab;width:34px;height:34px;display:grid;place-items:center;color:var(--dim);flex-shrink:0}
.drag{position:relative;z-index:5;background:var(--panel);box-shadow:0 6px 18px rgba(0,0,0,.55)}
.pm{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ac);flex-shrink:0}.pm.on{background:var(--cr);border-color:var(--cr);color:#070a0f}

function chart(p){
  if(!p.length)return `<div class="dim" style="padding:30px 0;text-align:center">No data yet</div>`;
  const W=330,H=170,L=34,B=22,mx=Math.max(...p.map(x=>x.v))*1.1||1,mn=Math.min(0,Math.min(...p.map(x=>x.v))*.9);
  const X=i=>p.length>1?L+i*(W-L-10)/(p.length-1):(W+L)/2,Y=v=>H-B-(v-mn)/(mx-mn)*(H-B-10);
  let g="";for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(190,225,240,.12)"/><text x="${L-5}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`}
  const lab=p.map((x,i)=>p.length<8||i%Math.ceil(p.length/6)===0?`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fd(x.t)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px">${g}<polygon fill="rgba(143,211,230,.12)" points="${X(0)},${H-B} ${p.map((x,i)=>X(i)+","+Y(x.v)).join(" ")} ${X(p.length-1)},${H-B}"/><polyline fill="none" stroke="#f3e9a8" stroke-width="1.5" points="${p.map((x,i)=>X(i)+","+Y(x.v)).join(" ")}"/>${p.map((x,i)=>{const z=i==p.length-1;return `<circle cx="${X(i)}" cy="${Y(x.v)}" r="${z?4:3}" fill="${z?"#f0583a":"#070a0f"}" stroke="${z?"#f0583a":"#f3e9a8"}"/>`}).join("")}${lab}</svg>`}

  else if(t.dataset.ef){ui.ef[t.dataset.ef]=t.value}
  else if(t.dataset.nt!==undefined){S.active.exs[t.dataset.i].note=t.value;save()}
  else if(t.dataset.f){const st=S.active.exs[t.dataset.i].sets[t.dataset.j];st[t.dataset.f]=parseFloat(t.value)||0;if(t.dataset.f==="kg")delete st.k0;save();updRec()}
});
document.addEventListener("change",e=>{if(e.target.dataset.ef==="prim"){ui.ef.prim=e.target.value;ui.ef.sec=ui.ef.sec.filter(m=>m!==e.target.value);showInfo();return}if(e.target.id==="seq"){ui.pick.eq=e.target.value;plist();return}if(e.target.id==="smu"){ui.pick.mu=e.target.value;plist();return}if(e.target.id==="imp"){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(d.workouts&&d.routines){S=d;S.info=S.info||{};S.hid=S.hid||[];migrate();save();render()}}catch(_){}})}});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==="tab"){ui.tab=v;ui.detail=null;ui.rd=null;ui.sd=null}
  else if(a==="startEmpty")return startW("Workout",[]);
  else if(a==="startR"){const r=S.routines.find(r=>r.id==v);return startW(r.name,r.exs)}
  else if(a==="resume"){ui.view="active"}
  else if(a==="min"){ui.view=null;ui.pick=null;ui.tab="home"}
  else if(a==="discard")ui.cf={k:"d",b:"Discard",t:"Discard Workout?",m:"Everything logged in this workout will be lost."}
  else if(a==="finish")return tryFinish();
  else if(a==="fgo")return finish();
  else if(a==="fdur")return finish(+v);
  else if(a==="fcustom"){const m=parseFloat($("#fmin").value);if(!(m>0)){$("#fmin").focus();return}return finish(m*60)}
  else if(a==="fback")ui.fin=null;
  else if(a==="chk"){const s=S.active.exs[el.dataset.i].sets[el.dataset.j];s.done=!s.done;if(s.done){ui.rest=Date.now();const x=S.active.exs[el.dataset.i],j=+el.dataset.j,r=S.active.deload?null:recOf(x.sets,priorFor(x.n,S.workouts.length));if(r&&(r.kg===j||r.vol===j))celebrate(x.n+": "+[r.kg===j&&"Heaviest weight ("+s.kg+"kg)",r.vol===j&&"Best set volume ("+s.kg*s.reps+"kg)"].filter(Boolean).join(" · "))}save()}
  else if(a==="rr")ui.rr=!ui.rr;
  else if(a==="rmv"){const d=+el.dataset.d,r=S.routines.find(x=>x.id==v),fl=[...new Set(S.routines.map(x=>x.folder))],dp=fl.flatMap(f=>S.routines.filter(x=>x.folder===f)),o=dp[dp.indexOf(r)+d];if(o){if(o.folder===r.folder){const i=S.routines.indexOf(r),j=S.routines.indexOf(o);[S.routines[i],S.routines[j]]=[S.routines[j],S.routines[i]]}else{S.routines.splice(S.routines.indexOf(r),1);r.folder=o.folder;const k=S.routines.indexOf(o);S.routines.splice(d<0?k+1:k,0,r)}save()}}
  else if(a==="openR"){scrollTo(0,0);ui.rd=S.routines.find(r=>r.id==v).id}
  else if(a==="rback")ui.rd=null;
  else if(a==="openS"){scrollTo(0,0);ui.sd=S.workouts.find(w=>w.id==v).id}
  else if(a==="sback")ui.sd=null;
  else if(a==="deload"){const A=S.active;A.deload=!A.deload;A.exs.forEach(x=>x.sets.forEach(t=>{if(t.done)return;if(A.deload){if(t.kg>0&&t.k0==null){const r=Math.round(t.kg*0.75/2.5)*2.5;if(r>0){t.k0=t.kg;t.kg=r}}}else if(t.k0!=null){t.kg=t.k0;delete t.k0}}));save()}
  else if(a==="sm"){const k=el.dataset.i+"-"+el.dataset.j;ui.sm=ui.sm===k?null:k}
  else if(a==="swt"){S.active.exs[el.dataset.i].sets[el.dataset.j].w=v==="1";ui.sm=null;save()}
  else if(a==="dels"){S.active.exs[el.dataset.i].sets.splice(el.dataset.j,1);ui.sm=null;save()}
  else if(a==="addset"){const x=S.active.exs[v],l=x.sets[x.sets.length-1];x.sets.push({kg:l?l.kg:0,reps:l?l.reps:0,done:false});save()}
  else if(a==="rmex"){const x=S.active.exs[v];if(x.sets.some(t=>t.done)){ui.cf={k:"e",id:+v,b:"Remove",t:"Remove Exercise?",m:"The sets you ticked for “"+x.n+"” will be discarded."}}else{S.active.exs.splice(v,1);save()}}
  else if(a==="rest"){ui.rest=v==="0"?0:Date.now()}
  else if(a==="askR"){const r=S.routines.find(r=>r.id===ui.rd);ui.cf={k:"r",id:r.id,t:"Delete Routine?",m:"“"+r.name+"” will be removed. Your logged workouts are kept."}}
  else if(a==="askW"){ui.cf={k:"w",id:ui.sd,t:"Delete This Session?",m:"It will be removed from your history and progress charts. This can’t be undone."}}
  else if(a==="askH"){ui.cf={k:"h",b:"Clear History",t:"Clear All History?",m:"Every logged workout, note and record will be deleted. Your routines and exercise list are kept. This can’t be undone, so save a backup first if you may want it."}}
  else if(a==="cfno")ui.cf=null;
  else if(a==="cfyes"){const c=ui.cf;if(c.k==="r"){S.routines=S.routines.filter(r=>r.id!==c.id);ui.rd=null}else if(c.k==="w"){S.workouts=S.workouts.filter(w=>w.id!==c.id);ui.sd=null}else if(c.k==="e"){S.active.exs.splice(c.id,1)}else if(c.k==="h"){S.workouts=[];ui.sd=null}else if(c.k==="x"){S.hid.push(c.id);ui.ef=null;ui.detail=null;if(ui.pick)ui.pick.sel=ui.pick.sel.filter(k=>k!==c.id)}else{S.active=null;ui.view=null;ui.rest=0}ui.cf=null;save()}
  else if(a==="editR"){const r=S.routines.find(r=>r.id==v);ui.pick={mode:"routine",editId:r.id,sel:[...r.exs],q:"",eq:"",mu:"",name:r.name,color:r.color||"",view:"add"}}
  else if(a==="newR")ui.pick={mode:"routine",sel:[],q:"",eq:"",mu:"",name:"",color:"",view:"add"};
  else if(a==="openPick")ui.pick={mode:"active",sel:[],q:"",eq:"",mu:"",view:"add"};
  else if(a==="pcp"){const e=$("#swr");e.style.display=e.style.display==="none"?"flex":"none";return}
  else if(a==="pcol"){ui.pick.color=v;document.querySelectorAll("#swr .sw2").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#cdot").style.background=v||"transparent";$("#swr").style.display="none";return}
  else if(a==="pview"){ui.pick.view=v;picker();return}
  else if(a==="pmv"){const i=+v,j=i+ +el.dataset.d,sl=ui.pick.sel;if(j>=0&&j<sl.length)[sl[i],sl[j]]=[sl[j],sl[i]];plist();return}
  else if(a==="prm"){ui.pick.sel.splice(+v,1);plist();pbtn();return}
  else if(a==="pcancel")ui.pick=null;
  else if(a==="psel"){const s=ui.pick.sel,i=s.indexOf(v);i<0?s.push(v):s.splice(i,1);plist();pbtn();return}
  else if(a==="pcreate")openEf(null);
  else if(a==="efEdit")openEf(ui.detail);
  else if(a==="efdel"){ui.cf={k:"x",id:ui.ef.orig,t:"Delete Exercise?",m:"“"+ui.ef.orig+"” will be removed from your exercise list. Your logged history for it is kept."}}
  else if(a==="efno")ui.ef=null;
  else if(a==="efsec"){const i=ui.ef.sec.indexOf(v);i<0?ui.ef.sec.push(v):ui.ef.sec.splice(i,1)}
  else if(a==="efsave"){const f=ui.ef,n=f.name.trim();if(!n){toast("Enter a name");return}if(!f.prim){toast("Choose a primary muscle");return}
    const M=[f.prim,...f.sec],ln=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);let key=f.orig;if(key){const e=[n,f.eq,M],nk=nm(e);if(nk!==key){if(lib().some(x=>nm(x)===nk)){toast("That exercise already exists");return}renameEx(key,e);key=nk}else{const ci=S.custom.findIndex(c=>nm(c)===key);if(ci>=0)S.custom[ci]=e}}
    if(!key){const e=[n,f.eq,M];key=nm(e);if(lib().some(x=>nm(x)===key)){if(!S.hid.includes(key)){toast("That exercise already exists");return}S.hid=S.hid.filter(k=>k!==key)}else S.custom.push(e);if(ui.pick){ui.pick.sel.push(key);ui.pick.q=""}}
    S.info[key]={m:M,steps:ln(f.steps),tips:ln(f.tips)};if(f.noteRef){const w=S.workouts.find(w=>w.id===f.noteRef.id),x=w&&w.exs.find(x=>x.n===key&&x.note);if(x){const v=f.note.trim();if(v)x.note=v;else delete x.note}}ui.ef=null;save()}
  else if(a==="pdone"){const p=ui.pick;if(!p.sel.length){toast("Select at least one exercise");return}if(p.mode==="routine"){const nme=(p.name||"").trim()||"New routine",er=p.editId&&S.routines.find(r=>r.id===p.editId);if(er){er.name=nme;er.exs=p.sel;er.color=p.color||""}else S.routines.push({id:Date.now(),folder:"My routines",name:nme,exs:p.sel,color:p.color||""})}else{p.sel.forEach(n=>S.active.exs.push({n,sets:[{kg:0,reps:0,done:false}]}))}ui.pick=null;save()}
  else if(a==="detail"){ui.detail=v;ui.dtab="sum";ui.metric="w"}
  else if(a==="back")ui.detail=null;
  else if(a==="dtab")ui.dtab=v;
  else if(a==="metric")ui.metric=v;
  else if(a==="export"){backup(false);return}
  else if(a==="share"){backup(true);return}
  else if(a==="import"){$("#imp").click();return}
  if(ui.pick&&INFOA.includes(a)){showInfo();showCf();if(a==="efsave"||a==="cfyes"){plist();pbtn()}}else render();
});
setInterval(()=>{
  if(ui.view==="active"&&S.active){const c=$("#clk");if(c)c.textContent=fmt((Date.now()-S.active.start)/1000);
    const r=$("#rest");if(r&&ui.rest){r.hidden=false;$("#rt").textContent=fmt((Date.now()-ui.rest)/1000)}}
},500);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
askP();render();
</script></body></html>
